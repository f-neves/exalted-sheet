# A free-plan Supabase project goes INACTIVE after about a week without activity, and a
# paused project stops resolving in DNS: the campaign area, /login and every character
# sheet backed by the database go down together, while the offline /sheet keeps working.
#
# A plain select through PostgREST (health check plus select on profiles, every third day)
# ran fine right up to the day the project paused anyway, so reads are not trusted to count.
# This job calls public.touch_keepalive(), which writes one row, three times a day. It needs
# no key beyond the anon one that already ships inside the client bundle, and the function
# takes no input and returns only a timestamp (see the end of supabase/migration.sql).
#
# One thing to know: GitHub disables scheduled workflows in a repository that has had no
# commits for 60 days, and it emails the owner when it does. If the project ever pauses
# anyway, check whether this schedule was switched off before looking anywhere else.

name: Keep Supabase awake

on:
  schedule:
    # 00:13, 08:13 and 16:13 UTC. The odd minute keeps it off the top of the hour, when
    # GitHub's scheduler queues jobs for many minutes. Three runs a day so that one
    # skipped or delayed run does not leave a day without activity.
    - cron: '13 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write to the database
        env:
          URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${URL:-}" ] || [ -z "${KEY:-}" ]; then
            echo "::error::PUBLIC_SUPABASE_URL / PUBLIC_SUPABASE_ANON_KEY are not set in Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          code=$(curl -sS -o body.txt -w '%{http_code}' --max-time 30 -X POST \
                   -H "apikey: $KEY" -H 'Content-Type: application/json' -d '{}' \
                   "$URL/rest/v1/rpc/touch_keepalive")
          echo "rpc/touch_keepalive -> $code  body: $(cat body.txt)"

          # 200 with a quoted timestamp means the row was written. A 404 means the function
          # is missing: apply supabase/migration.sql again.
          if [ "$code" != "200" ]; then
            echo "::error::The project did not answer. If DNS failed it is already paused: restore it from the Supabase dashboard, or POST /v1/projects/<ref>/restore."
            exit 1
          fi

          echo "Project is awake."
